name: ghosted

# Two ways to run this file:
#
#   docker compose --profile dev up -d      # dev: Postgres on localhost:5432, run the app with pnpm dev
#   docker compose --profile selfhost up -d # self-host: Postgres + the app, migrations on start
#
# Both profiles exist so that neither gets the other's exposure: the database is
# published to 127.0.0.1 only under `dev`, and the self-hosting shape — the one
# a stranger follows the guide for — publishes the app and nothing else. See
# docs/SELFHOST.md for the full walkthrough.

services:
  db:
    # `dev` publishes the port for the host's dev server; a self-hosted run does
    # not need it published at all.
    profiles: ["dev", "selfhost"]
    image: postgres:16-alpine
    container_name: ghosted-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghosted
      # Override this before anyone else can reach the host: it is the database
      # password, and the default is public knowledge.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghosted}
      POSTGRES_DB: ghosted
    ports:
      # Only under `dev`, and only on the loopback interface: the host's Next.js
      # dev server connects here. A self-hosted instance reaches the database
      # over the compose network and must not publish it — an exposed Postgres
      # with a password that is written in this file is a worse problem than
      # anything the application layer guards against.
      - "127.0.0.1:5432:5432"
    volumes:
      - ghosted_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghosted -d ghosted"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["selfhost"]
    build:
      context: .
    # Once published, pulling is faster than building:
    # image: ghcr.io/krisztianhadi/ghosted:latest
    container_name: ghosted-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Inside the compose network this is the service name, not localhost; the
      # password has to match the db service above.
      DATABASE_URL: postgres://ghosted:${POSTGRES_PASSWORD:-ghosted}@db:5432/ghosted
      # Refuse to send mail unencrypted: see docs/SELFHOST.md. Set to 1 only for
      # an unauthenticated relay on the same host.
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-}
      # Required: sessions are signed with it, and a placeholder would be worse
      # than a failed start. `openssl rand -base64 32`.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env (openssl rand -base64 32)}
      # Must match how you actually reach the instance: emailed links and the
      # canonical origin are built from these.
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      # Deployment shape — see .env.example for the full list and docs/SELFHOST.md
      # for what each combination does.
      SHOW_LANDING: ${SHOW_LANDING:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      GHOSTED_USER_EMAIL: ${GHOSTED_USER_EMAIL:-}
      GHOSTED_USER_NAME: ${GHOSTED_USER_NAME:-}
      GHOSTED_USER_PASSWORD: ${GHOSTED_USER_PASSWORD:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_URL: ${OPERATOR_URL:-}
      POWERED_BY_URL: ${POWERED_BY_URL:-}
      BRAND_TAG: ${BRAND_TAG:-}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-}
      UMAMI_SRC: ${UMAMI_SRC:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_DOMAINS: ${UMAMI_DOMAINS:-}
    # `next start` is not ready the moment the container is: the probe waits for
    # the migrations to run and the database to answer through the app itself.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  ghosted_pgdata:
    name: ghosted_pgdata
